<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">パンのイラスト</title>
  <desc>シンプルなパン（ロール）イラストのプレースホルダー</desc>
  <rect width="100%" height="100%" fill="#fff7ed" rx="12"/>

  <!-- ふんわりしたパン本体 -->
  <g transform="translate(50,70)">
    <ellipse cx="150" cy="80" rx="140" ry="70" fill="#f6c67a" />
    <ellipse cx="150" cy="60" rx="110" ry="50" fill="#f8d59a" />
    <!-- 焼き色 -->
    <path d="M40 80 C70 30, 230 30, 300 80" fill="none" stroke="#e2a64b" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <!-- ふわふわライン -->
    <path d="M50 60 C90 20, 130 20, 170 50 C210 80, 250 30, 300 60" fill="none" stroke="#f3b76a" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <!-- チャコールの小さな点（ゴマの代わり） -->
    <g fill="#b06a2b" opacity="0.9">
      <circle cx="120" cy="70" r="4" />
      <circle cx="170" cy="80" r="3.5" />
      <circle cx="200" cy="60" r="3" />
      <circle cx="90" cy="85" r="3.5" />
    </g>
  </g>
</svg>
