<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">かわいいパンのイラスト</title>
  <desc>やさしい雰囲気のかわいいパンのイラストのプレースホルダー</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#fff0d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#d7a05d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="18"/>

  <!-- かわいいパン本体 -->
  <g filter="url(#shadow)" transform="translate(35,35)">
    <!-- 影 -->
    <ellipse cx="165" cy="210" rx="120" ry="28" fill="#f0d1a0" opacity="0.6"/>

    <!-- パン -->
    <g>
      <ellipse cx="165" cy="120" rx="118" ry="70" fill="#f7c878"/>
      <ellipse cx="165" cy="102" rx="93" ry="52" fill="#f9d99a"/>
      <path d="M60 118 C86 65, 243 65, 275 118" fill="none" stroke="#e9a74e" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
      <path d="M70 100 C105 70, 133 70, 165 95 C198 120, 224 78, 267 97" fill="none" stroke="#f4b66c" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- 目 -->
    <g fill="#4a2b1b">
      <circle cx="135" cy="112" r="5.5"/>
      <circle cx="195" cy="112" r="5.5"/>
    </g>

    <!-- ほっぺ -->
    <g fill="#f7b9b1" opacity="0.9">
      <ellipse cx="125" cy="135" rx="12" ry="8"/>
      <ellipse cx="205" cy="135" rx="12" ry="8"/>
    </g>

    <!-- 口 -->
    <path d="M140 152 Q165 170 190 152" fill="none" stroke="#8d4d39" stroke-width="5" stroke-linecap="round"/>

    <!-- ゴマ -->
    <g fill="#b7762f" opacity="0.9">
      <circle cx="105" cy="125" r="4"/>
      <circle cx="145" cy="90" r="3.5"/>
      <circle cx="175" cy="82" r="3.5"/>
      <circle cx="220" cy="99" r="4"/>
      <circle cx="230" cy="130" r="3.3"/>
      <circle cx="100" cy="150" r="4"/>
    </g>
  </g>
</svg>
